# Glossary — single source of truth for terminology.
#
# Drives: <Term> component, scripts/check-glossary.ts, ConceptMap node labels.
# Schema: docs/terminology.md §3
#
# STATUS: every entry is `confirmed` (Phase 0 gate signed off).
# First introductions follow the user-first curriculum; technical depth may come later.

terms:
  # Stable term keys are grouped by topic below; not_before gives reading order.

  - id: llm
    en: LLM
    fa: LLM
    style: keep-latin
    first_use: LLM — مدل زبانی بزرگ
    short: LLM
    not_before: "1.2"
    def_fa: "برنامه‌ای که با خواندن حجم عظیمی از متن، یاد گرفته است کلمهٔ بعدی را حدس بزند."
    def_en: "A model trained on large text corpora to predict the next token."
    status: confirmed
    aliases: [Large Language Model, مدل زبانی بزرگ]
    zone: overview

  - id: context
    en: Context
    fa: کانتکست
    style: transliterate
    first_use: کانتکست (Context)
    short: کانتکست
    not_before: "1.2"
    def_fa: "همهٔ متنی که در یک فراخوانی جلوی مدل گذاشته می‌شود: دستور، تاریخچه، اسناد و پرسش."
    def_en: "All the text placed in front of the model for one call."
    status: confirmed
    aliases: [Context]
    zone: overview

  - id: turn
    en: Turn
    fa: نوبت
    style: translate
    first_use: نوبت گفت‌وگو (Turn)
    short: نوبت
    not_before: "1.2"
    def_fa: "در این کتاب، از پیام تازهٔ شما تا پاسخ نهایی دستیار؛ ممکن است چند فراخوانی مدل و اجرای ابزار داشته باشد."
    def_en: "In this book, the span from a new user message to the assistant's final reply; it may include multiple model calls and tool executions."
    status: confirmed
    aliases: []
    zone: overview

  - id: model
    en: Model
    fa: مدل
    style: translate
    first_use: مدل
    short: مدل
    not_before: "1.2"
    def_fa: "فایل‌های آموخته‌شده‌ای که ورودی متنی می‌گیرند و متن بیرون می‌دهند؛ خودش هیچ کاری انجام نمی‌دهد."
    def_en: "The trained weights that map input text to output text."
    status: confirmed
    aliases: []
    zone: overview

  - id: harness
    en: Harness
    fa: چارچوب اجرا
    style: translate-plus-latin
    first_use: چارچوب اجرا (Harness)
    short: چارچوب اجرا
    not_before: "1.2"
    def_fa: "برنامه‌ای که دور مدل را گرفته است؛ ورودی را می‌سازد، ابزارها را اجرا می‌کند و خروجی را مدیریت می‌کند."
    def_en: "The program around the model that assembles input, runs tools, and handles output."
    status: confirmed      # decided in Phase 0
    aliases: [Harness]
    zone: overview

  # ─────────────────────────────── Part 2 ───────────────────────────────

  - id: agent
    en: Agent
    fa: ایجنت
    style: transliterate
    first_use: ایجنت (Agent)
    short: ایجنت
    not_before: "2.1"
    def_fa: "سیستمی که برای رسیدن به یک هدف، خودش تصمیم می‌گیرد چه کارهایی و با چه ترتیبی انجام شود."
    def_en: "A system that decides which actions to take, and in what order, to reach a goal."
    status: confirmed
    aliases: [Agent]
    zone: agents

  - id: chatbot
    en: Chatbot
    fa: چت‌بات
    style: transliterate
    first_use: چت‌بات
    short: چت‌بات
    not_before: "2.1"
    def_fa: "رابط گفت‌وگویی برای گرفتن و فرستادن پیام؛ محصول می‌تواند ابزار و رفتار ایجنتی هم داشته باشد."
    def_en: "A conversational interface; the product may also provide tools and agentic behavior."
    status: confirmed
    aliases: [چتبات]
    zone: agents

  - id: tool-calling
    en: Tool calling
    fa: فراخوانی ابزار
    style: translate
    first_use: فراخوانی ابزار
    short: فراخوانی ابزار
    not_before: "2.2"
    def_fa: "مدل می‌گوید کدام ابزار با چه ورودی اجرا شود؛ اجرای واقعی کار چارچوب اجراست."
    def_en: "The model requests a tool and arguments; the harness executes it."
    status: confirmed
    aliases: [Tool calling, Tool use]
    zone: agents

  - id: function-calling
    en: Function calling
    fa: فراخوانی تابع
    style: translate
    first_use: فراخوانی تابع
    short: فراخوانی تابع
    not_before: "2.2"
    def_fa: "نام فنی فراخوانی ابزار در APIهای مدل."
    def_en: "The API-level name for tool calling."
    status: confirmed
    aliases: [Function calling]
    zone: agents

  - id: mcp
    en: MCP
    fa: MCP
    style: keep-latin
    first_use: MCP (Model Context Protocol)
    short: MCP
    not_before: "6.3"
    def_fa: "قرارداد مشترک اتصال برنامه‌ها به ابزار و منابع؛ کشف قابلیت به معنی اجازهٔ اجرا نیست."
    def_en: "A shared connection protocol for tools and resources; capability discovery is not execution authorization."
    status: confirmed
    aliases: [Model Context Protocol, پروتکل کانتکست مدل]
    zone: systems

  - id: skill
    en: Skill
    fa: مهارت
    style: translate-plus-latin
    first_use: مهارت (Skill)
    short: مهارت
    not_before: "2.3"
    def_fa: "بستهٔ دستورالعمل که فقط وقتی لازم شود به کانتکست اضافه می‌شود — می‌گوید کار چطور انجام شود."
    def_en: "A packaged set of instructions loaded into context on demand."
    status: confirmed
    aliases: [Skill]
    zone: agents

  - id: memory
    en: Memory
    fa: حافظه
    style: translate
    first_use: حافظه
    short: حافظه
    not_before: "2.4"
    def_fa: "چیزی که سیستم اطراف مدل ذخیره و بازخوانی می‌کند؛ خود مدل چیزی را به یاد نمی‌آورد."
    def_en: "State stored and recalled by the surrounding system, not by the model."
    status: confirmed
    aliases: []
    zone: agents

  - id: stateless
    en: Stateless
    fa: بدون وضعیت
    style: translate
    first_use: بدون وضعیت (Stateless)
    short: بدون وضعیت
    not_before: "2.4"
    def_fa: "مدل بین فراخوانی‌ها چیزی نگه نمی‌دارد؛ برنامه باید تاریخچه یا یادداشت لازم را دوباره در کانتکست قرار دهد."
    def_en: "Each call starts fresh; nothing is retained between calls."
    status: confirmed
    aliases: [Stateless, بی‌حافظه]
    zone: agents

  - id: workflow
    en: Workflow
    fa: ورک‌فلو
    style: transliterate
    first_use: ورک‌فلو (Workflow)
    short: ورک‌فلو
    not_before: "2.5"
    def_fa: "زنجیرهٔ مراحل از پیش تعیین‌شده؛ مسیر ثابت است و مدل آن را انتخاب نمی‌کند."
    def_en: "A predefined sequence of steps; the path is fixed, not chosen by the model."
    status: confirmed
    aliases: [Workflow, ورکفلو]
    zone: agents

  # ─────────────────────────────── Model concepts ──────────────────────

  - id: inference
    en: Inference
    fa: استنتاج
    style: translate
    first_use: استنتاج (Inference)
    short: استنتاج
    not_before: "5.1"
    def_fa: "اجرای مدل آماده برای تولید خروجی؛ منابع محاسباتی مصرف می‌کند."
    def_en: "Running a trained model to produce output, consuming computation."
    status: confirmed
    aliases: [Inference]
    zone: model

  - id: token
    en: Token
    fa: توکن
    style: transliterate
    first_use: توکن (Token)
    short: توکن
    not_before: "5.2"
    def_fa: "تکه‌های کوچکی که متن به آن‌ها شکسته می‌شود؛ واحد شمارش محدودیت و هزینه."
    def_en: "The small text pieces a model reads and bills by."
    status: confirmed
    aliases: [Token]
    zone: model

  - id: context-window
    en: Context window
    fa: ظرفیت کانتکست
    style: translate-plus-latin
    first_use: ظرفیت کانتکست (Context Window)
    short: ظرفیت کانتکست
    not_before: "5.3"
    def_fa: "حداکثر اندازهٔ کانتکست؛ مدل در یک فراخوانی بیشتر از این نمی‌بیند."
    def_en: "The maximum amount of context a model can consider in a single pass."
    status: confirmed
    aliases: [Context window, Context length]
    zone: model

  - id: system-prompt
    en: System prompt
    fa: دستور سیستم
    style: translate
    first_use: دستور سیستم (System Prompt)
    short: دستور سیستم
    not_before: "1.2"
    def_fa: "دستورالعملی که در ورودی مدل نقش و قواعد را تعیین می‌کند؛ خودش نوبت گفت‌وگو نیست."
    def_en: "Fixed instructions placed atop the context on every call."
    status: confirmed
    aliases: [System prompt]
    zone: overview

  - id: training
    en: Training
    fa: آموزش
    style: translate
    first_use: آموزش (Training)
    short: آموزش
    not_before: "3.3"
    def_fa: "فرایند تغییر پارامترهای مدل با داده و محاسبه؛ با دریافت پاسخ در یک گفت‌وگو یکی نیست."
    def_en: "Updating model parameters using data and computation, distinct from receiving a conversational response."
    status: confirmed
    aliases: [Training]
    zone: practice

  - id: pretraining
    en: Pre-training
    fa: پیش‌آموزش
    style: translate
    first_use: پیش‌آموزش (Pre-training)
    short: پیش‌آموزش
    not_before: "5.4"
    def_fa: "مرحلهٔ اول آموزش: خواندن حجم عظیمی از متن برای یادگیری زبان و دانش عمومی."
    def_en: "First training stage: learning language and general knowledge from bulk text."
    status: confirmed
    aliases: [Pre-training, Pretraining, پیش آموزش]
    zone: model

  - id: fine-tuning
    en: Fine-tuning
    fa: فاین‌تیونینگ
    style: transliterate
    first_use: فاین‌تیونینگ (Fine-tuning)
    short: فاین‌تیونینگ
    not_before: "5.4"
    def_fa: "آموزش بیشتر مدل آماده با دادهٔ منتخب؛ می‌تواند رفتار، قالب و دانش را تغییر دهد."
    def_en: "Further training of a ready model on selected data; it can change behavior, format, and knowledge."
    status: confirmed
    aliases: [Fine-tuning, Finetuning, فاین تیونینگ]
    zone: model

  - id: alignment
    en: Alignment
    fa: هم‌راستاسازی
    style: translate-plus-latin
    first_use: هم‌راستاسازی (Alignment)
    short: هم‌راستاسازی
    not_before: "5.4"
    def_fa: "هدف و روش‌های نزدیک‌کردن رفتار مدل به انتظارهای مطلوب؛ تضمین بی‌خطایی نیست."
    def_en: "Goals and methods for shaping model behavior toward desired expectations, without guaranteeing correctness or safety."
    status: confirmed
    aliases: [Alignment, هم راستاسازی]
    zone: model

  - id: rlhf
    en: RLHF
    fa: RLHF
    style: keep-latin
    first_use: RLHF (یادگیری تقویتی با بازخورد انسان)
    short: RLHF
    not_before: "5.4"
    def_fa: "روشی برای هم‌راستاسازی که در آن انسان‌ها پاسخ‌های بهتر را انتخاب می‌کنند."
    def_en: "An alignment method where humans rank preferred responses."
    status: confirmed
    aliases: [Reinforcement Learning from Human Feedback]
    zone: model

  - id: hallucination
    en: Hallucination
    fa: توهم
    style: translate-plus-latin
    first_use: توهم (Hallucination)
    short: توهم
    not_before: "4.1"
    def_fa: "وقتی مدل ادعایی نادرست یا بی‌پشتوانه می‌سازد، حتی اگر روان و باورپذیر باشد."
    def_en: "A fluent, plausible output with no fact behind it."
    status: confirmed
    aliases: [Hallucination, هالوسینیشن]
    zone: judgment

  - id: reasoning
    en: Reasoning
    fa: استدلال
    style: translate
    first_use: استدلال (Reasoning)
    short: استدلال
    not_before: "3.2"
    def_fa: "صرف کار و محاسبهٔ بیشتر برای حل مسئله؛ می‌تواند کمک کند، اما درستی را تضمین نمی‌کند."
    def_en: "Spending more compute at answer time on intermediate steps."
    status: confirmed
    aliases: [Reasoning]
    zone: practice

  - id: benchmark
    en: Benchmark
    fa: بنچمارک
    style: transliterate
    first_use: بنچمارک (Benchmark)
    short: بنچمارک
    not_before: "5.7"
    def_fa: "آزمون استاندارد برای مقایسهٔ مدل‌ها. مفید، اما کار شما را اندازه نمی‌گیرد."
    def_en: "A standard test for comparing models; not a measure of your task."
    status: confirmed
    aliases: [Benchmark]
    zone: model

  # ─────────────────────────────── Requests and sources ─────────────────

  - id: api
    en: API
    fa: API
    style: keep-latin
    first_use: API (واسط برنامه‌نویسی)
    short: API
    not_before: "6.1"
    def_fa: "راهی که یک برنامه از برنامهٔ دیگر چیزی می‌خواهد؛ اینجا: فرستادن متن و گرفتن متن."
    def_en: "The programmatic interface for sending text and receiving text."
    status: confirmed
    aliases: []
    zone: systems

  - id: temperature
    en: Temperature
    fa: دما
    style: translate-plus-latin
    first_use: دما (Temperature)
    short: دما
    not_before: "6.1"
    def_fa: "تنظیمی که مشخص می‌کند مدل چقدر پاسخ‌های کم‌احتمال‌تر را انتخاب کند."
    def_en: "A setting controlling how often the model picks less likely tokens."
    status: confirmed
    aliases: [Temperature]
    zone: systems

  - id: prompt
    en: Prompt
    fa: پرامپت
    style: transliterate
    first_use: پرامپت (Prompt)
    short: پرامپت
    not_before: "3.4"
    def_fa: "متن درخواست: هدف، مواد مرتبط، محدودیت، خروجی و معیار پایان؛ نقش و نمونه هم می‌توانند کمک کنند."
    def_en: "A task brief describing the goal, relevant material, constraints, deliverable, and completion criteria; roles and examples can support it."
    status: confirmed
    aliases: [Prompt, پرومپت]
    zone: practice

  - id: few-shot
    en: Few-shot
    fa: چند-نمونه
    style: translate-plus-latin
    first_use: چند-نمونه (Few-shot)
    short: چند-نمونه
    not_before: "3.4"
    def_fa: "گذاشتن چند مثال از پاسخ درست داخل پرامپت تا مدل الگو را بگیرد."
    def_en: "Including a few worked examples in the prompt."
    status: confirmed
    aliases: [Few-shot, Few shot]
    zone: practice

  - id: context-engineering
    en: Context engineering
    fa: چیدمان کانتکست
    style: translate
    first_use: چیدمان کانتکست (Context Engineering)
    short: چیدمان کانتکست
    not_before: "6.2"
    def_fa: "کار واقعی: انتخاب و چیدن درست چیزهایی که در کانتکست قرار می‌گیرند."
    def_en: "Choosing and arranging what goes into the context window."
    status: confirmed
    aliases: [Context engineering]
    zone: systems

  - id: rag
    en: RAG
    fa: RAG
    style: keep-latin
    first_use: RAG (تولید افزوده با بازیابی)
    short: RAG
    not_before: "6.4"
    def_fa: "پیش از پاسخ‌دادن، مرتبط‌ترین تکه‌های اسناد شما پیدا و به کانتکست اضافه می‌شوند."
    def_en: "Retrieve relevant document chunks, add them to context, then generate."
    status: confirmed
    aliases: [Retrieval Augmented Generation, Retrieval-Augmented Generation]
    zone: systems

  - id: embedding
    en: Embedding
    fa: امبدینگ
    style: transliterate
    first_use: امبدینگ (بردار معنایی)
    short: امبدینگ
    not_before: "6.4"
    def_fa: "تبدیل یک متن به فهرستی از عددها، به‌گونه‌ای که متن‌های هم‌معنا عددهای نزدیک بگیرند."
    def_en: "A numeric vector where similar meanings land close together."
    status: confirmed
    aliases: [Embedding, بردار معنایی]
    zone: systems

  - id: chunking
    en: Chunking
    fa: تکه‌تکه‌کردن
    style: translate-plus-latin
    first_use: تکه‌تکه‌کردن (Chunking)
    short: تکه‌تکه‌کردن
    not_before: "6.4"
    def_fa: "بریدن اسناد بلند به قطعه‌های کوچک، تا بتوان فقط قطعهٔ مرتبط را بازیابی کرد."
    def_en: "Splitting long documents into retrievable pieces."
    status: confirmed
    aliases: [Chunking]
    zone: systems

  - id: vector-database
    en: Vector database
    fa: پایگاه دادهٔ برداری
    style: translate
    first_use: پایگاه دادهٔ برداری (Vector Database)
    short: پایگاه دادهٔ برداری
    not_before: "6.4"
    def_fa: "جایی که امبدینگ‌ها نگه داشته می‌شوند تا نزدیک‌ترین‌ها سریع پیدا شوند."
    def_en: "Storage for embeddings with fast nearest-neighbor search."
    status: confirmed
    aliases: [Vector database, Vector store, پایگاه داده برداری]
    zone: systems

  - id: semantic-search
    en: Semantic search
    fa: جست‌وجوی معنایی
    style: translate
    first_use: جست‌وجوی معنایی (Semantic Search)
    short: جست‌وجوی معنایی
    not_before: "6.4"
    def_fa: "جست‌وجو بر پایهٔ معنا نه کلمهٔ دقیق؛ پرسش دربارهٔ بررسی تغییر، بخش تست و بازبینی راهنما را پیدا می‌کند."
    def_en: "Search by meaning rather than exact keyword."
    status: confirmed
    aliases: [Semantic search, جستجوی معنایی]
    zone: systems

  - id: eval
    en: Eval
    fa: ارزیابی
    style: translate-plus-latin
    first_use: ارزیابی (Eval)
    short: ارزیابی
    not_before: "4.5"
    def_fa: "سنجش نتیجه با معیار مشخص؛ در بررسی منظم از نمونه‌های نماینده و معیارهای ثابت استفاده می‌کنیم."
    def_en: "Assessing outcomes against explicit criteria; systematic evaluation uses representative cases and stable criteria."
    status: confirmed
    aliases: [Eval, Evals, Evaluation]
    zone: judgment

  - id: regression
    en: Regression
    fa: پس‌رفت
    style: translate-plus-latin
    first_use: پس‌رفت (Regression)
    short: پس‌رفت
    not_before: "6.6"
    def_fa: "وقتی تغییری میانگین را بهتر می‌کند اما موردی که قبلاً درست بود را می‌شکند."
    def_en: "A change that improves the average while breaking a previously passing case."
    status: confirmed
    aliases: [Regression]
    zone: systems

  # ─────────────────────────────── Operation and safety ────────────────

  - id: orchestrator
    en: Orchestrator
    fa: هماهنگ‌کننده
    style: translate-plus-latin
    first_use: هماهنگ‌کننده (Orchestrator)
    short: هماهنگ‌کننده
    not_before: "6.10"
    def_fa: "بخشی که کانتکست را می‌سازد، مدل را صدا می‌زند، ابزارها را اجرا می‌کند و حلقه را می‌گرداند."
    def_en: "The component that assembles context, calls the model, and runs the loop."
    status: confirmed
    aliases: [Orchestrator, ارکستریتور]
    zone: systems

  - id: gateway
    en: Gateway
    fa: دروازه
    style: translate-plus-latin
    first_use: دروازه (Gateway)
    short: دروازه
    not_before: "6.10"
    def_fa: "نقطهٔ ورود همهٔ درخواست‌ها؛ جای احراز هویت، محدودیت نرخ و ثبت گزارش."
    def_en: "The single entry point handling auth, rate limiting, and logging."
    status: confirmed
    aliases: [Gateway]
    zone: systems

  - id: cost
    en: Cost
    fa: هزینه
    style: translate
    first_use: هزینه
